<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - adminHMD</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .user-table { margin-top: 30px; }
    .status-badge { padding: 5px 10px; border-radius: 4px; font-size: 12px; }
    .status-badge.active { background: #d4edda; color: #155724; }
    .status-badge.inactive { background: #f8d7da; color: #721c24; }
    .loading { text-align: center; padding: 40px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">adminHMD</a>
      <div class="ms-auto">
        <span id="userName" class="text-white me-3"></span>
        <button class="btn btn-sm btn-light" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Users Management</h2>
      <button class="btn btn-primary" id="addUserBtn">Add User</button>
    </div>

    <div id="loading" class="loading">Loading users...</div>
    <div id="error" class="alert alert-danger" style="display: none;"></div>

    <table class="table table-striped user-table" id="usersTable" style="display: none;">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>

  <!-- Add/Edit User Modal -->
  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalTitle">Add User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="userForm">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" id="userName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="userEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Role</label>
              <select class="form-control" id="userRole">
                <option value="user">User</option>
                <option value="moderator">Moderator</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select class="form-control" id="userStatus">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="suspended">Suspended</option>
              </select>
            </div>
            <div id="formError" class="alert alert-danger" style="display: none;"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveUserBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api-client.js"></script>
  <script>
    let currentUserId = null;
    let currentPage = 0;
    const PAGE_SIZE = 10;

    // Check authentication
    if (!window.apiClient.token) {
      window.location.href = 'login-api.html';
    }

    // Load users on page load
    loadUsers();

    // Event listeners
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('addUserBtn').addEventListener('click', openAddUserModal);
    document.getElementById('saveUserBtn').addEventListener('click', saveUser);

    async function loadUsers() {
      try {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('error').style.display = 'none';
        document.getElementById('usersTable').style.display = 'none';

        const response = await window.apiClient.users.getAll(PAGE_SIZE, currentPage * PAGE_SIZE);
        const users = response.data;
        const tbody = document.getElementById('usersBody');
        tbody.innerHTML = '';

        users.forEach((user) => {
          const row = document.createElement('tr');
          const statusClass = user.status === 'active' ? 'active' : 'inactive';
          row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.role}</td>
            <td><span class="status-badge ${statusClass}">${user.status}</span></td>
            <td>${new Date(user.created_at).toLocaleDateString()}</td>
            <td>
              <button class="btn btn-sm btn-info" onclick="editUser(${user.id})">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id})">Delete</button>
            </td>
          `;
          tbody.appendChild(row);
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('usersTable').style.display = 'table';
      } catch (error) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = error.message;
        document.getElementById('error').style.display = 'block';
      }
    }

    function openAddUserModal() {
      currentUserId = null;
      document.getElementById('userModalTitle').textContent = 'Add User';
      document.getElementById('userForm').reset();
      new window.bootstrap.Modal(document.getElementById('userModal')).show();
    }

    async function editUser(userId) {
      try {
        const response = await window.apiClient.users.getById(userId);
        const user = response.data;
        currentUserId = userId;
        document.getElementById('userModalTitle').textContent = 'Edit User';
        document.getElementById('userName').value = user.name;
        document.getElementById('userEmail').value = user.email;
        document.getElementById('userRole').value = user.role;
        document.getElementById('userStatus').value = user.status;
        new window.bootstrap.Modal(document.getElementById('userModal')).show();
      } catch (error) {
        alert(error.message);
      }
    }

    async function saveUser() {
      try {
        const data = {
          name: document.getElementById('userName').value,
          email: document.getElementById('userEmail').value,
          role: document.getElementById('userRole').value,
          status: document.getElementById('userStatus').value,
        };

        if (currentUserId) {
          await window.apiClient.users.update(currentUserId, data);
        } else {
          await window.apiClient.users.create(data);
        }

        window.bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
        loadUsers();
      } catch (error) {
        document.getElementById('formError').textContent = error.message;
        document.getElementById('formError').style.display = 'block';
      }
    }

    async function deleteUser(userId) {
      if (!confirm('Are you sure you want to delete this user?')) return;
      try {
        await window.apiClient.users.delete(userId);
        loadUsers();
      } catch (error) {
        alert(error.message);
      }
    }

    function logout() {
      window.apiClient.auth.logout();
      window.location.href = 'login-api.html';
    }
  </script>
</body>
</html>
