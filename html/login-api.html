<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - adminHMD</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { background: white; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); padding: 40px; max-width: 400px; }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
    .error { color: #dc3545; font-size: 14px; margin-top: 5px; display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2 class="text-center mb-4">Admin Dashboard</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="admin@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>
      <div id="errorMessage" class="error"></div>
      <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
    </form>
    <p class="text-center text-muted small">Don't have an account? <a href="register.html">Register</a></p>
  </div>

  <script src="../assets/js/api-client.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('errorMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';
      errorDiv.textContent = '';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await window.apiClient.auth.login({ email, password });
        window.apiClient.setToken(response.token);
        window.location.href = 'index.html';
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
